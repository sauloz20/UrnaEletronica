<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Urna Eletrônica Brasileira</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      user-select: none;
    }
    .font-mono-custom {
      font-family: 'Roboto Mono', monospace;
    }
    /* Estilo do display LCD retro da urna */
    .lcd-screen {
      background: linear-gradient(135deg, #e0e8e0 0%, #c8d6c8 100%);
      box-shadow: inset 0 0 10px rgba(0,0,0,0.15);
    }
    /* Botões físicos */
    .btn-key {
      background: linear-gradient(180deg, #2a2d32 0%, #17191c 100%);
      box-shadow: 0 4px 0 #0a0b0c, 0 5px 10px rgba(0,0,0,0.3);
      transition: all 0.05s ease;
    }
    .btn-key:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #0a0b0c, 0 2px 5px rgba(0,0,0,0.3);
    }
    .btn-branco {
      background: linear-gradient(180deg, #ffffff 0%, #e0e0e0 100%);
      box-shadow: 0 4px 0 #a0a0a0, 0 5px 10px rgba(0,0,0,0.2);
    }
    .btn-branco:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #a0a0a0, 0 2px 5px rgba(0,0,0,0.2);
    }
    .btn-corrige {
      background: linear-gradient(180deg, #ff6b4a 0%, #d93d1a 100%);
      box-shadow: 0 4px 0 #99220a, 0 5px 10px rgba(0,0,0,0.2);
    }
    .btn-corrige:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #99220a, 0 2px 5px rgba(0,0,0,0.2);
    }
    .btn-confirma {
      background: linear-gradient(180deg, #00c853 0%, #008e3a 100%);
      box-shadow: 0 4px 0 #005723, 0 5px 10px rgba(0,0,0,0.2);
    }
    .btn-confirma:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #005723, 0 2px 5px rgba(0,0,0,0.2);
    }
    /* Animação para digitação */
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .cursor-blink {
      animation: blink 1s infinite;
    }
  </style>
</head>
<body class="bg-slate-900 min-h-screen text-slate-100 flex flex-col items-center justify-center p-2 sm:p-4">

  <!-- Container Principal da Urna -->
  <div class="w-full max-w-5xl bg-slate-200 rounded-3xl p-4 sm:p-8 shadow-2xl border-4 border-slate-300 text-slate-900">
    
    <!-- Header / Identificação -->
    <div class="flex flex-col sm:flex-row justify-between items-center pb-4 mb-6 border-b-2 border-slate-300 gap-2">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 bg-yellow-400 rounded-full flex items-center justify-center font-bold text-slate-900 border-2 border-green-600">
          🇧🇷
        </div>
        <div>
          <h1 class="text-xl sm:text-2xl font-black tracking-wider uppercase text-slate-800">Justiça Eleitoral</h1>
          <p class="text-xs text-slate-600 font-semibold">Simulador de Urna Eletrônica - Presidente</p>
        </div>
      </div>
      <div id="status-bar" class="text-xs bg-slate-300 px-3 py-1.5 rounded-full font-mono text-slate-700">
        Eleição Ativa
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      
      <!-- TELA DA URNA (LCD) -->
      <div class="lg:col-span-7 flex flex-col">
        <div id="screen" class="lcd-screen w-full h-[420px] sm:h-[450px] rounded-2xl p-4 sm:p-6 border-4 border-slate-400 relative flex flex-col justify-between overflow-hidden shadow-inner text-slate-900">
          <!-- Conteúdo gerado via JS -->
        </div>
      </div>

      <!-- TECLADO NUMÉRICO E BOTÕES DA URNA -->
      <div class="lg:col-span-5 bg-slate-800 p-4 sm:p-6 rounded-2xl flex flex-col justify-between shadow-xl border-2 border-slate-700">
        <div class="text-center mb-4">
          <span class="text-slate-400 text-xs font-semibold uppercase tracking-widest">Teclado de Votação</span>
        </div>

        <!-- Teclado Numérico -->
        <div class="grid grid-cols-3 gap-3 mb-6 max-w-[280px] mx-auto w-full">
          <button onclick="pressKey('1')" class="btn-key text-white text-2xl font-bold h-14 rounded-xl flex items-center justify-center">1</button>
          <button onclick="pressKey('2')" class="btn-key text-white text-2xl font-bold h-14 rounded-xl flex items-center justify-center">2</button>
          <button onclick="pressKey('3')" class="btn-key text-white text-2xl font-bold h-14 rounded-xl flex items-center justify-center">3</button>
          <button onclick="pressKey('4')" class="btn-key text-white text-2xl font-bold h-14 rounded-xl flex items-center justify-center">4</button>
          <button onclick="pressKey('5')" class="btn-key text-white text-2xl font-bold h-14 rounded-xl flex items-center justify-center">5</button>
          <button onclick="pressKey('6')" class="btn-key text-white text-2xl font-bold h-14 rounded-xl flex items-center justify-center">6</button>
          <button onclick="pressKey('7')" class="btn-key text-white text-2xl font-bold h-14 rounded-xl flex items-center justify-center">7</button>
          <button onclick="pressKey('8')" class="btn-key text-white text-2xl font-bold h-14 rounded-xl flex items-center justify-center">8</button>
          <button onclick="pressKey('9')" class="btn-key text-white text-2xl font-bold h-14 rounded-xl flex items-center justify-center">9</button>
          <div class="col-span-1"></div>
          <button onclick="pressKey('0')" class="btn-key text-white text-2xl font-bold h-14 rounded-xl flex items-center justify-center">0</button>
          <div class="col-span-1"></div>
        </div>

        <!-- Botões de Ação -->
        <div class="grid grid-cols-3 gap-2 sm:gap-3 pt-2 border-t border-slate-700">
          <button onclick="pressBranco()" class="btn-branco text-slate-800 text-xs sm:text-sm font-black h-14 rounded-xl flex items-center justify-center uppercase tracking-wider">Branco</button>
          <button onclick="pressCorrige()" class="btn-corrige text-white text-xs sm:text-sm font-black h-14 rounded-xl flex items-center justify-center uppercase tracking-wider">Corrige</button>
          <button onclick="pressConfirma()" class="btn-confirma text-white text-xs sm:text-sm font-black h-14 rounded-xl flex items-center justify-center uppercase tracking-wider">Confirma</button>
        </div>
      </div>

    </div>

    <!-- Painel Lateral de Controle / Resultados -->
    <div class="mt-8 pt-6 border-t-2 border-slate-300 flex flex-wrap justify-between items-center gap-4 text-sm text-slate-600">
      <div class="flex items-center space-x-2">
        <span class="inline-block w-3 h-3 rounded-full bg-green-500 animate-pulse"></span>
        <span>Simulação Pronta - Cargo: Presidente</span>
      </div>
      <div class="flex gap-3">
        <button onclick="resetAllVotes()" class="px-4 py-2 bg-slate-300 hover:bg-slate-400 text-slate-800 font-bold rounded-lg transition-colors">
          Zerar Urna
        </button>
        <button onclick="openModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-900 text-white font-bold rounded-lg transition-colors">
          Ver Apuração
        </button>
      </div>
    </div>

  </div>

  <!-- Modal de Apuração -->
  <div id="resultsModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-white text-slate-900 rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-300">
      <div class="flex justify-between items-center border-b pb-3 mb-4">
        <h2 class="text-xl font-black text-slate-800">Apuração de Votos</h2>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-700 font-bold text-xl">&times;</button>
      </div>
      <div id="modalBody" class="space-y-4">
        <!-- Preenchido via JS -->
      </div>
      <div class="mt-6 pt-4 border-t text-right">
        <button onclick="closeModal()" class="px-4 py-2 bg-slate-800 text-white font-bold rounded-lg hover:bg-slate-700 transition">Fechar</button>
      </div>
    </div>
  </div>

  <script>
    // --- CANDIDATOS CADASTRADOS ---
    const CANDIDATES = [
      {
        number: '13',
        name: 'Candidato 13',
        vice: 'Vice Candidato 13',
        party: 'PT - Partido dos Trabalhadores',
        photo: 'https://images.unsplash.com/photo-1560250097-0b93528c311a?w=150&auto=format&fit=crop&q=80'
      },
      {
        number: '22',
        name: 'Candidato 22',
        vice: 'Vice Candidato 22',
        party: 'PL - Partido Liberal',
        photo: 'https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?w=150&auto=format&fit=crop&q=80'
      }
    ];

    // --- ESTADO DA URNA ---
    let currentNumber = '';
    let isWhiteVote = false;
    let isFinished = false;
    let resetTimer = null;

    let votes = {
      '13': 0,
      '22': 0,
      'BRANCO': 0,
      'NULO': 0
    };

    // --- ÁUDIO (Web Audio API) ---
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playBeep(frequency, duration, delay = 0) {
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(frequency, audioCtx.currentTime + delay);

        gain.gain.setValueAtTime(0.15, audioCtx.currentTime + delay);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + duration);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(audioCtx.currentTime + delay);
        osc.stop(audioCtx.currentTime + delay + duration);
      } catch (e) {
        console.log('Audio playback error:', e);
      }
    }

    function playKeySound() {
      playBeep(1200, 0.05);
    }

    function playConfirmSound() {
      playBeep(450, 0.15, 0);
      playBeep(450, 0.15, 0.15);
      playBeep(450, 0.4, 0.3);
    }

    // --- AÇÕES DO TECLADO ---
    function pressKey(n) {
      if (isFinished || isWhiteVote) return;

      if (currentNumber.length < 2) {
        currentNumber += n;
        playKeySound();
        renderScreen();
      }
    }

    function pressBranco() {
      if (isFinished) return;

      if (currentNumber === '') {
        isWhiteVote = true;
        playKeySound();
        renderScreen();
      }
    }

    function pressCorrige() {
      if (isFinished) return;
      
      playKeySound();
      currentNumber = '';
      isWhiteVote = false;
      renderScreen();
    }

    function pressConfirma() {
      if (isFinished) return;

      let confirmed = false;

      if (isWhiteVote) {
        votes['BRANCO']++;
        confirmed = true;
      } else if (currentNumber.length === 2) {
        if (votes.hasOwnProperty(currentNumber)) {
          votes[currentNumber]++;
        } else {
          votes['NULO']++;
        }
        confirmed = true;
      }

      if (confirmed) {
        playConfirmSound();
        isFinished = true;
        renderFimScreen();
        
        // Reset automático após 3 segundos para o próximo eleitor
        resetTimer = setTimeout(() => {
          startNextVoter();
        }, 3000);
      }
    }

    function startNextVoter() {
      if (resetTimer) clearTimeout(resetTimer);
      currentNumber = '';
      isWhiteVote = false;
      isFinished = false;
      renderScreen();
    }

    function resetAllVotes() {
      if (resetTimer) clearTimeout(resetTimer);
      votes = { '13': 0, '22': 0, 'BRANCO': 0, 'NULO': 0 };
      startNextVoter();
    }

    // --- RENDERIZAÇÃO TELA DA URNA ---
    function renderScreen() {
      const screen = document.getElementById('screen');

      const candidate = !isWhiteVote && currentNumber.length === 2 
        ? CANDIDATES.find(c => c.number === currentNumber) 
        : null;

      const isNull = !isWhiteVote && currentNumber.length === 2 && !candidate;

      let digitsHTML = '';
      for (let i = 0; i < 2; i++) {
        const digit = currentNumber[i] || '';
        const isCurrent = i === currentNumber.length && !isWhiteVote;
        digitsHTML += `
          <div class="w-10 h-14 border-2 border-slate-700 flex items-center justify-center text-3xl font-black font-mono-custom ${isCurrent ? 'bg-slate-300 cursor-blink' : 'bg-slate-100'}">
            ${digit}
          </div>
        `;
      }

      screen.innerHTML = `
        <div class="flex-1 flex flex-col justify-between">
          <div>
            <div class="text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">SEU VOTO VAI PARA</div>
            <div class="text-2xl font-black uppercase text-slate-800 mb-4">PRESIDENTE</div>

            ${!isWhiteVote ? `
              <div class="flex items-center gap-3 mb-4">
                <span class="text-sm font-bold text-slate-700">Número:</span>
                <div class="flex gap-2">${digitsHTML}</div>
              </div>
            ` : ''}

            ${isWhiteVote ? `
              <div class="mt-8 text-center text-3xl font-black text-slate-700 uppercase tracking-widest">
                VOTO EM BRANCO
              </div>
            ` : ''}

            ${isNull ? `
              <div class="mt-4">
                <div class="text-xl font-bold text-red-600 mb-1">NÚMERO ERRADO</div>
                <div class="text-2xl font-black text-slate-700">VOTO NULO</div>
              </div>
            ` : ''}

            ${candidate ? `
              <div class="space-y-2 mt-2">
                <div>
                  <span class="text-xs font-bold text-slate-500 uppercase block">Nome:</span>
                  <span class="text-lg font-black text-slate-800">${candidate.name}</span>
                </div>
                <div>
                  <span class="text-xs font-bold text-slate-500 uppercase block">Partido:</span>
                  <span class="text-sm font-bold text-slate-700">${candidate.party}</span>
                </div>
                <div>
                  <span class="text-xs font-bold text-slate-500 uppercase block">Vice-Presidente:</span>
                  <span class="text-sm font-semibold text-slate-700">${candidate.vice}</span>
                </div>
              </div>
            ` : ''}
          </div>

          ${candidate ? `
            <div class="absolute top-4 right-4 border-2 border-slate-700 bg-slate-300 p-1 rounded shadow">
              <img src="${candidate.photo}" alt="Foto Candidato" class="w-24 h-32 object-cover rounded-sm" onerror="this.src='https://placehold.co/150x200/cccccc/333333?text=Sem+Foto'">
            </div>
          ` : ''}

          <div class="border-t-2 border-slate-400 pt-2 text-[10px] sm:text-xs text-slate-600 font-semibold">
            <p>Aperte a tecla:</p>
            <p class="text-green-700 font-bold">CONFIRMA para CONFIRMAR este voto</p>
            <p class="text-orange-600 font-bold">CORRIGE para REINICIAR este voto</p>
          </div>
        </div>
      `;
    }

    function renderFimScreen() {
      const screen = document.getElementById('screen');
      screen.innerHTML = `
        <div class="h-full flex flex-col items-center justify-center">
          <h1 class="text-7xl font-black text-slate-800 tracking-widest mb-4">FIM</h1>
          <p class="text-sm font-bold text-slate-600 uppercase tracking-wider">VOTO GRAVADO</p>
          <p class="text-xs text-slate-500 mt-6 animate-pulse">Reiniciando urna em 3 segundos...</p>
        </div>
      `;
    }

    // --- MODAL DE APURAÇÃO ---
    function openModal() {
      const totalVotes = votes['13'] + votes['22'] + votes['BRANCO'] + votes['NULO'];
      const modalBody = document.getElementById('modalBody');

      modalBody.innerHTML = `
        <div class="bg-slate-100 p-3 rounded-lg flex justify-between items-center mb-4 border border-slate-200">
          <span class="font-bold text-slate-700">Total de Votos:</span>
          <span class="font-mono-custom text-lg font-black">${totalVotes}</span>
        </div>

        <div class="space-y-3">
          ${CANDIDATES.map(c => {
            const count = votes[c.number];
            const pct = totalVotes > 0 ? ((count / totalVotes) * 100).toFixed(1) : '0.0';
            return `
              <div class="p-3 bg-slate-50 border rounded-xl flex justify-between items-center">
                <div>
                  <div class="font-black text-slate-800">${c.name} (${c.number})</div>
                  <div class="text-xs text-slate-500">${c.party}</div>
                </div>
                <div class="text-right">
                  <div class="font-mono-custom font-bold text-lg text-slate-800">${count}</div>
                  <div class="text-xs text-slate-500 font-semibold">${pct}%</div>
                </div>
              </div>
            `;
          }).join('')}

          <div class="p-3 bg-slate-50 border rounded-xl flex justify-between items-center">
            <span class="font-bold text-slate-700">Votos Brancos</span>
            <div class="text-right">
              <span class="font-mono-custom font-bold text-slate-800">${votes['BRANCO']}</span>
              <div class="text-xs text-slate-500">${totalVotes > 0 ? ((votes['BRANCO'] / totalVotes) * 100).toFixed(1) : '0.0'}%</div>
            </div>
          </div>

          <div class="p-3 bg-slate-50 border rounded-xl flex justify-between items-center">
            <span class="font-bold text-slate-700">Votos Nulos</span>
            <div class="text-right">
              <span class="font-mono-custom font-bold text-slate-800">${votes['NULO']}</span>
              <div class="text-xs text-slate-500">${totalVotes > 0 ? ((votes['NULO'] / totalVotes) * 100).toFixed(1) : '0.0'}%</div>
            </div>
          </div>
        </div>
      `;

      document.getElementById('resultsModal').classList.remove('hidden');
      document.getElementById('resultsModal').classList.add('flex');
    }

    function closeModal() {
      document.getElementById('resultsModal').classList.add('hidden');
      document.getElementById('resultsModal').classList.remove('flex');
    }

    // Inicialização
    window.onload = function() {
      renderScreen();
    };
  </script>
</body>
</html>
